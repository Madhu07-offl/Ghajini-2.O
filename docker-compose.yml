services:
  mongo:
    image: mongo:latest
    container_name: ghajini_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ghajini_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ghajini_api
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=Ghajini 2.0
      - API_V1_STR=/v1
      - DATABASE_URL=sqlite:///./ghajini.db
      - MONGODB_URL=mongodb://mongo:27017
      - DEMO_MODE=true
      - FACE_T_HIGH=0.50
      - FACE_T_LOW=0.38
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2:3b
      - OLLAMA_TEMPERATURE=0.2
      - OLLAMA_MAX_TOKENS=120
      - OLLAMA_TIMEOUT_SECONDS=15.0
      - DATA_DIR=./data
      - UPLOAD_DIR=./data/uploads
      - DEFAULT_PATIENT_ID=1
    volumes:
      - api_data:/app/data
    depends_on:
      - ollama
      - mongo
    restart: unless-stopped

volumes:
  mongo_data:
  ollama_models:
  api_data:
